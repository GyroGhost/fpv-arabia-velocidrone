name: Daily VelociDrone track

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      new_track:
        description: "Replace today's track: type random, or paste a VelociDrone leaderboard link (leave empty for a normal check)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the track
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1564178851389767710"
          GUILD_ID: "1536435906108596286"
          WINNER_ROLE_ID: ${{ vars.WINNER_ROLE_ID }}
          START_HOUR: "20"
          TIMEZONE: Asia/Kuwait
          NEW_TRACK: ${{ github.event.inputs.new_track }}
        run: python run.py

      - name: Save state
        if: always()
        run: |
          git config user.name "GyroGhost"
          git config user.email "111621931+BADERFPV@users.noreply.github.com"
          git add data/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update track state"
            git pull --rebase -q
            git push
          fi
